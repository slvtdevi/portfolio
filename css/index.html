    <link rel="stylesheet" href="css/style.css" />
    <script>
      /* Skala Home Cover: frame Figma 1264×630 dipaskan ke satu layar (100vh). */
      (function () {
        function fit() {
          var w = innerWidth,
            h = innerHeight,
            mobile = w <= 760;
          /* desktop: seluruh frame 1264×630; mobile: stage 560 lebar, total tinggi 1035 */
          var k = mobile
            ? Math.min(w / 560, h / 1035)
            : Math.min(w / 1264, h / 630);
          document.documentElement.style.setProperty("--k", k.toFixed(4));
        }
        fit();
        addEventListener("resize", fit);
      })();
    </script>
    <title>devi's mart — visual communication design portfolio 2026</title>
    <meta
      name="description"
      content="a little shop of branding, packaging & social media by Silavati Devi."
